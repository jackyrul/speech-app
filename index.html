<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Ежедневный тренажёр речи: дикция, голос, темп, структура. 8-недельная программа.">

  <!-- PWA / iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Речевой">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#4F46E5">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1A1D26">

  <title>Речевой Тренажёр</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">

  <!-- iOS touch icon — генерируем через canvas чтобы emoji отображался правильно -->
  <link rel="apple-touch-icon" id="apple-touch-icon" href="icons/icon.svg">

  <script>
    // Генерируем PNG иконку для iOS через canvas (эквалайзер-логотип)
    (function () {
      try {
        var c = document.createElement('canvas');
        c.width = c.height = 512;
        var ctx = c.getContext('2d');
        var g = ctx.createLinearGradient(0, 0, 512, 512);
        g.addColorStop(0, '#4F46E5');
        g.addColorStop(1, '#7C3AED');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.roundRect(0, 0, 512, 512, 115);
        ctx.fill();
        // Белые полосы эквалайзера [x, y, w, h]
        ctx.fillStyle = '#fff';
        [[112,181,40,150],[174,132,40,248],[236,96,40,320],[298,156,40,200],[360,121,40,270]]
          .forEach(function (b) {
            ctx.beginPath();
            ctx.roundRect(b[0], b[1], b[2], b[3], 20);
            ctx.fill();
          });
        var link = document.getElementById('apple-touch-icon');
        if (link) link.href = c.toDataURL('image/png');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app">
    <div class="splash">
      <svg class="splash-icon" viewBox="0 0 512 512" width="72" height="72" aria-label="Речевой">
        <defs><linearGradient id="splashbg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs>
        <rect width="512" height="512" rx="115" fill="url(#splashbg)"/>
        <g fill="#fff">
          <rect x="112" y="181" width="40" height="150" rx="20"/>
          <rect x="174" y="132" width="40" height="248" rx="20"/>
          <rect x="236" y="96"  width="40" height="320" rx="20"/>
          <rect x="298" y="156" width="40" height="200" rx="20"/>
          <rect x="360" y="121" width="40" height="270" rx="20"/>
        </g>
      </svg>
      <div class="splash-text">Загрузка...</div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/recorder.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Регистрируем Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .catch(function (e) { console.warn('SW:', e); });
      });
    }
  </script>
</body>
</html>
