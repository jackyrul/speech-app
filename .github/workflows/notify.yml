name: Daily reminder

on:
  schedule:
    # 17:00 UTC ежедневно (~20:00 Киев). Поменяй время при желании.
    - cron: '0 17 * * *'
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install web-push --no-save
      - run: node scripts/send-push.js
        env:
          VAPID_PUBLIC: 'BPTDrhf7FJLx2j8zSsJjxNxfXDUtvzeu8BzgH5kE2X_jNOHLxyErnnxGLON6GEtVI-OEnDhjR0w2cGzmLZppTlw'
          VAPID_SUBJECT: 'mailto:jackyrul92@gmail.com'
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          GH_TOKEN: ${{ secrets.PUSH_GH_TOKEN }}
